<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <pattern id="geometric_poly" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Khối đa giác lập thể chính -->
      <polygon points="60,10 110,60 60,110 10,60" fill="#7C3AED" fill-opacity="0.08" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.45"/>
      <!-- Khối đa giác lồng bên trong -->
      <polygon points="60,30 90,60 60,90 30,60" fill="#EC4899" fill-opacity="0.06" stroke="#C084FC" stroke-width="0.9" stroke-opacity="0.40"/>
      <!-- Tâm điểm đa diện -->
      <circle cx="60" cy="60" r="3.5" fill="#A855F7" fill-opacity="0.6"/>
      <circle cx="60" cy="60" r="1.5" fill="#F472B6"/>
      <!-- Các tia liên kết góc đa diện -->
      <line x1="10" y1="60" x2="30" y2="60" stroke="#8B5CF6" stroke-width="1.0" stroke-opacity="0.4"/>
      <line x1="90" y1="60" x2="110" y2="60" stroke="#8B5CF6" stroke-width="1.0" stroke-opacity="0.4"/>
      <line x1="60" y1="10" x2="60" y2="30" stroke="#8B5CF6" stroke-width="1.0" stroke-opacity="0.4"/>
      <line x1="60" y1="90" x2="60" y2="110" stroke="#8B5CF6" stroke-width="1.0" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#geometric_poly)"/>
</svg>
