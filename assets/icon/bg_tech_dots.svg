<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <pattern id="tech_dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <!-- Mạch vi xử lý kết nối các điểm -->
      <path d="M 24 0 L 24 48 M 0 24 L 48 24" stroke="#6366F1" stroke-width="0.75" stroke-opacity="0.22" stroke-dasharray="2 4"/>
      <!-- Chấm trung tâm vi mạch chính phát sáng -->
      <circle cx="24" cy="24" r="3.0" fill="#4F46E5" fill-opacity="0.65"/>
      <circle cx="24" cy="24" r="1.5" fill="#A5B4FC"/>
      <!-- Các chấm vệ tinh số hóa -->
      <circle cx="0" cy="0" r="1.8" fill="#6366F1" fill-opacity="0.45"/>
      <circle cx="48" cy="0" r="1.8" fill="#6366F1" fill-opacity="0.45"/>
      <circle cx="0" cy="48" r="1.8" fill="#6366F1" fill-opacity="0.45"/>
      <circle cx="48" cy="48" r="1.8" fill="#6366F1" fill-opacity="0.45"/>
      <!-- Chấm phụ góc phần tư -->
      <circle cx="12" cy="12" r="1.2" fill="#818CF8" fill-opacity="0.35"/>
      <circle cx="36" cy="36" r="1.2" fill="#818CF8" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#tech_dots)"/>
</svg>
